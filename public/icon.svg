<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10453A"/>
      <stop offset="1" stop-color="#0A2E26"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7D27A"/>
      <stop offset="1" stop-color="#E8B23E"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- Coin-as-allocation-donut: ring split into 3 budget segments -->
  <g transform="translate(256,256)">
    <!-- segment 1: largest share (gold) -->
    <path d="M 0,-150 A 150,150 0 0 1 129.9,75 L 69.3,40 A 80,80 0 0 0 0,-80 Z"
          fill="url(#gold)"/>
    <!-- segment 2: medium share (mint) -->
    <path d="M 129.9,75 A 150,150 0 0 1 -129.9,75 L -69.3,40 A 80,80 0 0 0 69.3,40 Z"
          fill="#8FDDB1"/>
    <!-- segment 3: small share (pale gold, quieter) -->
    <path d="M -129.9,75 A 150,150 0 0 1 0,-150 L 0,-80 A 80,80 0 0 0 -69.3,40 Z"
          fill="#F3E3B8"/>
    <!-- segment separators (tile color, makes the allocation split explicit) -->
    <g stroke="#0C352C" stroke-width="14" stroke-linecap="round">
      <line x1="0" y1="-80" x2="0" y2="-150"/>
      <line x1="69.3" y1="40" x2="129.9" y2="75"/>
      <line x1="-69.3" y1="40" x2="-129.9" y2="75"/>
    </g>
    <!-- coin core -->
    <circle r="52" fill="url(#gold)"/>
    <circle r="52" fill="none" stroke="#0A2E26" stroke-opacity="0.18" stroke-width="6"/>
  </g>
</svg>
