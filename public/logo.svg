<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" role="img" aria-label="Budget app logo">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7D27A"/>
      <stop offset="1" stop-color="#E8B23E"/>
    </linearGradient>
  </defs>

  <!-- Mark (works on light backgrounds; ink-green segments) -->
  <g transform="translate(70,70) scale(0.42)">
    <path d="M 0,-150 A 150,150 0 0 1 129.9,75 L 69.3,40 A 80,80 0 0 0 0,-80 Z" fill="url(#gold)"/>
    <path d="M 129.9,75 A 150,150 0 0 1 -129.9,75 L -69.3,40 A 80,80 0 0 0 69.3,40 Z" fill="#3FA877"/>
    <path d="M -129.9,75 A 150,150 0 0 1 0,-150 L 0,-80 A 80,80 0 0 0 -69.3,40 Z" fill="#0E3B2E"/>
    <g stroke="#FFFFFF" stroke-width="14" stroke-linecap="round">
      <line x1="0" y1="-80" x2="0" y2="-150"/>
      <line x1="69.3" y1="40" x2="129.9" y2="75"/>
      <line x1="-69.3" y1="40" x2="-129.9" y2="75"/>
    </g>
    <circle r="52" fill="url(#gold)"/>
    <circle r="52" fill="none" stroke="#0E3B2E" stroke-opacity="0.25" stroke-width="6"/>
  </g>

  <!-- Wordmark: replace "YourBudget" with your app's name -->
  <text x="150" y="86" font-family="Avenir Next, Nunito Sans, Segoe UI, sans-serif"
        font-size="52" font-weight="700" letter-spacing="-0.5" fill="#0E3B2E">YourBudget</text>
</svg>
