# Local Supabase project configuration.
# Populated by `supabase init`; this file is committed to the repo.
# Run `supabase start` to bring up the local stack on the ports below.

project_id = "budget"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "IPv4"

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3023"
additional_redirect_urls = ["http://localhost:3023"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1s"

[auth.email.smtp]
enabled = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = false
